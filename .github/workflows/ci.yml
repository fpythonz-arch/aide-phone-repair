name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (PHPUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Dépendances
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Configuration
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Tests
        run: php artisan test

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build de production
        run: npm run build

      - name: "Vérification de types (non bloquante, 190 erreurs préexistantes)"
        run: npx vue-tsc --noEmit -p tsconfig.app.json
        continue-on-error: true
