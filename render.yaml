services:
  # Backend Laravel (Web Service avec Docker)
  - type: web
    name: aide-phone-repair-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: APP_NAME
        value: "AIDE PHONE REPARATION"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: aide-phone-repair-backend
          property: host
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: aide-phone-repair-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: aide-phone-repair-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: aide-phone-repair-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: aide-phone-repair-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: aide-phone-repair-db
          property: password
      - key: DB_SSLMODE
        value: require
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_STORE
        value: array
      - key: QUEUE_CONNECTION
        value: sync
      - key: FRONTEND_URL
        fromService:
          type: web
          name: aide-phone-repair-frontend
          property: host

  # Frontend Vue (Static Site)
  - type: web
    name: aide-phone-repair-frontend
    runtime: static
    staticPublishPath: ./frontend/dist
    buildCommand: cd frontend && npm install && npm run build
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: aide-phone-repair-backend
          property: host
